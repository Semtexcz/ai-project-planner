name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline deterministic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Check lock consistency
        run: uv lock --check
      - name: Run offline test suite
        run: uv run --locked pytest -m "not integration"

  integration:
    name: Native installer integration (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run pinned native integration checks
        run: uv run --locked pytest -m integration
